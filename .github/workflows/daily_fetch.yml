name: Aggiorna prezzi GME

on:
  schedule:
    # Ogni giorno alle 14:00 UTC (~16:00 ora italiana), dopo la pubblicazione
    # dei risultati MGP. Gira sui server di GitHub, non sul tuo PC.
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # permette anche di lanciarlo manualmente da GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica i prezzi (con recupero automatico dei giorni mancanti)
        id: fetch
        run: python fetch_prices.py

      - name: Salva i nuovi dati nel repo
        run: |
          git config user.name "gme-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prezzi_zonali.csv
          git diff --quiet --cached || git commit -m "Aggiornamento dati prezzi $(date -u +%F)"
          git push
