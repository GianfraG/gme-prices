name: Aggiorna prezzi GME

on:
  schedule:
    # Una volta al giorno alle 14:00 UTC (metà pomeriggio ora italiana),
    # dopo che il mercato del giorno prima ha pubblicato i risultati
    # (di norma entro le 13:00 CET). Il dataset ha risoluzione di 15
    # minuti, ma questo riguarda la granularità dei prezzi pubblicati,
    # non la frequenza con cui vale la pena controllarli: un solo run al
    # giorno basta, la dashboard si occupa poi di aggiornarsi visivamente
    # (vedi app.py). La logica di recupero automatico in fetch_prices.py
    # copre eventuali run saltati.
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # permette anche di lanciarlo manualmente da GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica i prezzi (con recupero automatico dei giorni mancanti)
        id: fetch
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python fetch_prices.py

      - name: Salva i nuovi dati nel repo
        run: |
          git config user.name "gme-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prezzi_zonali.csv data/last_update.json
          git diff --quiet --cached || git commit -m "Aggiornamento dati prezzi $(date -u +%FT%TZ)"
          git push
