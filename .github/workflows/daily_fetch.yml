name: Aggiorna prezzi GME

on:
  schedule:
    # Tre orari al giorno invece di uno solo, distanziati e volutamente
    # fuori dalla punta d'ora (mai ":00"/":15"/":30"/":45"). Verificato
    # sul campo il 2026-07-28: un singolo trigger schedulato (sia alle
    # 13:00 che alle 13:53 UTC) puo' semplicemente non scattare affatto
    # per oltre un'ora, non solo essere in ritardo - GitHub stesso non
    # garantisce l'esecuzione puntuale degli schedule, specie nei
    # minuti "tondi" dove si accumulano piu' richieste da tutti gli
    # utenti insieme. fetch_prices.py e' idempotente: se un run trova
    # i dati gia' scaricati da un run precedente lo stesso giorno, non
    # fa nulla (nessun rischio di duplicati o sprechi rilevanti).
    - cron: "7 13 * * *"   # ~1h dopo la pubblicazione (12:55 CET)
    - cron: "37 13 * * *"  # backup +30 minuti
    - cron: "22 14 * * *"  # backup +1h15m dal primo
  workflow_dispatch: {}  # permette anche di lanciarlo manualmente da GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica i prezzi (con recupero automatico dei giorni mancanti)
        id: fetch
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python fetch_prices.py

      - name: Salva i nuovi dati nel repo
        run: |
          git config user.name "gme-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prezzi_zonali.csv data/last_update.json
          git diff --quiet --cached || git commit -m "Aggiornamento dati prezzi $(date -u +%FT%TZ)"
          git push
