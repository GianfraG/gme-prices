name: Aggiorna prezzi GME

on:
  schedule:
    # Una volta al giorno alle 13:07 UTC (14:07-15:07 ora italiana a
    # seconda della stagione), circa un'ora dopo la pubblicazione
    # regolare degli esiti del mercato del giorno prima (12:55 CET),
    # con margine di sicurezza per eventuali ritardi occasionali. Il
    # dataset ha risoluzione di 15 minuti, ma questo riguarda la
    # granularità dei prezzi pubblicati, non la frequenza con cui vale
    # la pena controllarli (i prezzi non cambiano più una volta
    # pubblicati): un solo run al giorno basta, la dashboard si occupa
    # poi di aggiornarsi visivamente (vedi app.py). La logica di
    # recupero automatico in fetch_prices.py copre eventuali run saltati
    # o giorni in cui la pubblicazione arriva più tardi del previsto.
    #
    # Orario deliberatamente NON in punta d'ora (":07" invece di ":00"):
    # GitHub stesso segnala che gli schedule allo scoccare dell'ora sono
    # i piu' soggetti a ritardi o a essere del tutto saltati, perche' e'
    # l'istante in cui si accumulano piu' richieste da tutti gli utenti.
    #
    # TEST TEMPORANEO 2026-07-28: cron spostato a 13:53 UTC solo per
    # verificare che lo schedule automatico scatti davvero da solo,
    # dopo che quello delle 13:00 di oggi non e' partito. Da ripristinare
    # (e da estendere con 2-3 orari ridondanti) una volta verificato.
    - cron: "53 13 * * *"
  workflow_dispatch: {}  # permette anche di lanciarlo manualmente da GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica i prezzi (con recupero automatico dei giorni mancanti)
        id: fetch
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python fetch_prices.py

      - name: Salva i nuovi dati nel repo
        run: |
          git config user.name "gme-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prezzi_zonali.csv data/last_update.json
          git diff --quiet --cached || git commit -m "Aggiornamento dati prezzi $(date -u +%FT%TZ)"
          git push
